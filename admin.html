
<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY STORE — ადმინისტრატორი</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 400px;
      background: #1c1c1c;
      padding: 28px;
      border-radius: 16px;
      border: 1px solid #383838;
    }
    h1 { text-align: center; color: #ff3030; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      background: #292929;
      color: white;
      border: 1px solid #555;
    }
    button {
      background: #e32636;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    #message { text-align: center; color: #ff7777; }
    #dashboard { display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>MY STORE</h1>
    <div id="login">
      <h2>ადმინისტრატორის შესვლა</h2>
      <input id="email" type="email" placeholder="ელფოსტა">
      <input id="password" type="password" placeholder="პაროლი">
      <button id="loginBtn">შესვლა</button>
      <p id="message"></p>
    </div>

    <div id="dashboard">
      <h2>ადმინისტრატორის პანელი</h2>
      <p>ავტორიზაცია წარმატებულია.</p>
      <button id="logoutBtn">გასვლა</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    async function checkAdmin(user) {
      const { data, error } = await supabase
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

      if (error || !data) {
        await supabase.auth.signOut();
        message.textContent = "ამ ანგარიშს ადმინისტრატორის უფლება არ აქვს.";
        return;
      }

      login.style.display = "none";
      dashboard.style.display = "block";
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      message.textContent = "მიმდინარეობს შესვლა...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "შესვლა ვერ მოხერხდა. შეამოწმე ელფოსტა და პაროლი.";
        return;
      }

      await checkAdmin(data.user);
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      dashboard.style.display = "none";
      login.style.display = "block";
      message.textContent = "ანგარიშიდან გამოხვედი.";
    });

    const { data: { session } } = await supabase.auth.getSession();

    if (session?.user) {
      await checkAdmin(session.user);
    }
  </script>
</body>
</html>
