
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY STORE — Admin</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#101010;color:white;
 font-family:Arial,sans-serif;display:flex;align-items:center;
 justify-content:center;padding:20px
}
.panel{
 width:100%;max-width:420px;background:#1d1d1d;
 border:1px solid #393939;border-radius:18px;padding:28px;
 box-shadow:0 15px 45px #0008
}
h1{text-align:center;color:#ff3030;margin-top:0}
h2{text-align:center}
input,button{
 width:100%;padding:15px;margin-top:14px;
 border-radius:9px;font-size:16px
}
input{background:#292929;border:1px solid #555;color:white}
button{background:#e32636;color:white;border:0;font-weight:bold}
button:disabled{opacity:.6}
#message{text-align:center;color:#ff8585;line-height:1.5}
#dashboard{display:none;text-align:center}
.status{color:#8ee6a0}
</style>
</head>
<body>
<div class="panel">
 <h1>MY STORE</h1>

 <div id="login">
  <h2>ადმინისტრატორის შესვლა</h2>
  <input id="email" type="email" placeholder="ელფოსტა" autocomplete="username">
  <input id="password" type="password" placeholder="პაროლი" autocomplete="current-password">
  <button id="loginBtn">შესვლა</button>
  <p id="message"></p>
 </div>

 <div id="dashboard">
  <h2>ადმინისტრატორის პანელი</h2>
  <p class="status">ადმინისტრატორი წარმატებით შევიდა.</p>
  <p id="adminEmail"></p>
  <button id="logoutBtn">გასვლა</button>
 </div>
</div>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://zlpotkepmucwzhtndycz.supabase.co";
const SUPABASE_KEY = "sb_publishable_qFNKu2mnmjkTIBWs8X0rzg_bbHtkb4O";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const loginBox = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");

async function checkAdmin(user) {
  const { data, error } = await supabase
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error || !data) {
    await supabase.auth.signOut();
    loginBox.style.display = "block";
    dashboard.style.display = "none";
    message.textContent =
      "ამ ანგარიშს ადმინისტრატორის უფლება არ აქვს.";
    return;
  }

  loginBox.style.display = "none";
  dashboard.style.display = "block";
  document.getElementById("adminEmail").textContent = user.email || "";
}

loginBtn.addEventListener("click", async () => {
  message.textContent = "";
  loginBtn.disabled = true;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    message.textContent = "შეავსე ორივე ველი.";
    loginBtn.disabled = false;
    return;
  }

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = "შესვლა ვერ მოხერხდა. შეამოწმე მონაცემები.";
    loginBtn.disabled = false;
    return;
  }

  await checkAdmin(data.user);
  loginBtn.disabled = false;
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  dashboard.style.display = "none";
  loginBox.style.display = "block";
  document.getElementById("password").value = "";
  message.textContent = "ანგარიშიდან გამოხვედი.";
});

const { data: { session } } = await supabase.auth.getSession();

if (session?.user) {
  await checkAdmin(session.user);
}
</script>
</body>
</html>
