
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY STORE | Online Shopping</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#fff;color:#171717}
header{background:#111;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:27px;font-weight:900;letter-spacing:2px}
header button{background:white;color:#111;border:0;padding:12px 18px;cursor:pointer;border-radius:4px;font-weight:bold}
.hero{background:#e9e9e9;padding:75px 7%;text-align:center}
.hero h1{font-size:clamp(35px,7vw,65px);margin-bottom:15px}
.hero p{font-size:17px;color:#555;margin-bottom:25px}
.hero a{display:inline-block;background:#111;color:white;padding:15px 30px;text-decoration:none}
.categories{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:30px 15px}
.categories button{border:1px solid #ddd;background:white;padding:12px 20px;cursor:pointer}
.categories button.active,.categories button:hover{background:#111;color:white}
.section{padding:20px 5% 60px}
.section h2{font-size:30px;margin-bottom:25px}
.search{width:100%;max-width:400px;padding:13px;border:1px solid #ddd;margin-bottom:25px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.product{border:1px solid #eee;padding-bottom:17px}
.product img{width:100%;height:260px;object-fit:cover;background:#eee}
.product h3,.product p{margin:12px 12px}
.price{font-weight:bold;font-size:19px}
.product button{margin:5px 12px;background:#111;color:white;border:0;padding:12px;cursor:pointer;width:calc(100% - 24px)}
.product button:hover{background:#444}
footer{background:#111;color:white;text-align:center;padding:35px 15px}
#cartPanel{display:none;padding:25px 5%;background:#f5f5f5}
#cartPanel h2{margin-bottom:15px}
.cartItem{padding:10px 0;border-bottom:1px solid #ddd}
#cartPanel button{padding:10px 18px;margin-top:12px;cursor:pointer}
@media(max-width:850px){.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.products{gap:10px}.product img{height:190px}.product h3{font-size:14px}.product p{font-size:14px}}
</style>
</head>
<body>

<header>
  <div class="logo">MY STORE</div>
  <button onclick="toggleCart()">🛒 კალათა (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>YOUR STYLE. YOUR STORE.</h1>
  <p>აღმოაჩინე შენი სტილი MY STORE-ში</p>
  <a href="#shop">შეიძინე ახლავე</a>
</section>

<nav class="categories">
  <button class="active" onclick="filterProducts('ყველა',this)">ყველა</button>
  <button onclick="filterProducts('ქალი',this)">ქალის ტანსაცმელი</button>
  <button onclick="filterProducts('კაცი',this)">მამაკაცის ტანსაცმელი</button>
  <button onclick="filterProducts('ფეხსაცმელი',this)">ფეხსაცმელი</button>
</nav>

<section id="shop" class="section">
  <h2>ჩვენი პროდუქცია</h2>
  <input class="search" id="search" placeholder="🔍 მოძებნე პროდუქტი..." oninput="renderProducts()">
  <div class="products" id="products"></div>
</section>

<section id="cartPanel">
  <h2>შენი კალათა</h2>
  <div id="cartItems"></div>
  <h3 id="total">სულ: 0 ₾</h3>
  <button onclick="checkout()">შეკვეთის გაფორმება</button>
  <button onclick="toggleCart()">დახურვა</button>
</section>

<footer>
  <h2>MY STORE</h2>
  <p>შენი სტილი იწყება აქ.</p>
  <p>© 2026 MY STORE. ყველა უფლება დაცულია.</p>
</footer>

<script>
const products=[
{id:1,name:"ქალის ყოველდღიური მაისური",price:45,cat:"ქალი",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600"},
{id:2,name:"მამაკაცის მაისური",price:55,cat:"კაცი",img:"https://images.unsplash.com/photo-1529374255404-311a2a4f1fd9?w=600"},
{id:3,name:"სპორტული ფეხსაცმელი",price:150,cat:"ფეხსაცმელი",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"},
{id:4,name:"ქალის ჯინსი",price:95,cat:"ქალი",img:"https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=600"},
{id:5,name:"მამაკაცის ქურთუკი",price:180,cat:"კაცი",img:"https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=600"},
{id:6,name:"ქალის ფეხსაცმელი",price:125,cat:"ფეხსაცმელი",img:"https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=600"},
{id:7,name:"ქალის ზედა",price:65,cat:"ქალი",img:"https://images.unsplash.com/photo-1551163943-3f6a855d1153?w=600"},
{id:8,name:"მამაკაცის შარვალი",price:110,cat:"კაცი",img:"https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=600"}
];

let cart=[];
let category="ყველა";

function renderProducts(){
const q=document.getElementById("search").value.toLowerCase();
const list=products.filter(p=>(category==="ყველა"||p.cat===category)&&p.name.toLowerCase().includes(q));
document.getElementById("products").innerHTML=list.map(p=>`
<div class="product">
<img src="${p.img}" alt="${p.name}">
<h3>${p.name}</h3>
<p class="price">${p.price} ₾</p>
<button onclick="addCart(${p.id})">კალათაში დამატება</button>
</div>`).join("");
}

function filterProducts(cat,btn){
category=cat;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
renderProducts();
}

function addCart(id){
cart.push(products.find(p=>p.id===id));
updateCart();
}

function updateCart(){
document.getElementById("count").innerText=cart.length;
document.getElementById("cartItems").innerHTML=cart.map((p,i)=>`
<div class="cartItem">${p.name} — ${p.price} ₾
<button onclick="removeCart(${i})">წაშლა</button></div>`).join("");
document.getElementById("total").innerText="სულ: "+cart.reduce((s,p)=>s+p.price,0)+" ₾";
}

function removeCart(i){
cart.splice(i,1);
updateCart();
}

function toggleCart(){
const panel=document.getElementById("cartPanel");
panel.style.display=panel.style.display==="block"?"none":"block";
}

function checkout(){
if(!cart.length){alert("კალათა ცარიელია!");return;}
alert("შეკვეთის მიღების სისტემა შემდეგ ეტაპზე დავამატოთ.");
}

renderProducts();
</script>
</body>
</html>
