
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>MY STORE — ჩემი ანგარიში</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#101010;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.card{
  width:100%;
  max-width:420px;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:18px;
  padding:28px;
  box-shadow:0 15px 45px #0008;
}
.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:8px;
}
.logo span{color:#e53935}
.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}
.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}
.tabs button{
  flex:1;
  padding:12px;
  border:1px solid #444;
  background:#292929;
  color:#fff;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}
.tabs button.active{
  background:#e53935;
  border-color:#e53935;
}
label{
  display:block;
  margin:14px 0 7px;
  color:#ddd;
  font-size:14px;
}
input{
  width:100%;
  padding:14px;
  border:1px solid #444;
  background:#101010;
  color:#fff;
  border-radius:9px;
  outline:none;
  font-size:16px;
}
input:focus{border-color:#e53935}
.main-btn{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:9px;
  background:#e53935;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.main-btn:disabled{opacity:.6;cursor:wait}
.message{
  display:none;
  padding:12px;
  margin-top:16px;
  border-radius:8px;
  background:#292929;
  line-height:1.5;
  font-size:14px;
  overflow-wrap:anywhere;
}
.links{
  text-align:center;
  margin-top:22px;
  line-height:2;
}
a{color:#ff625d;text-decoration:none}
.account-box{text-align:center}
.account-email{
  color:#ff625d;
  overflow-wrap:anywhere;
  margin:15px 0;
}
.hidden{display:none}
</style>
</head>
<body>

<div class="card">
  <div class="logo">MY <span>STORE</span></div>
  <div class="subtitle">მოგესალმებით ჩვენს მაღაზიაში</div>

  <div id="authArea">
    <div class="tabs">
      <button id="loginTab" class="active" type="button">შესვლა</button>
      <button id="registerTab" type="button">რეგისტრაცია</button>
    </div>

    <form id="authForm">
      <label for="email">ელფოსტა</label>
      <input id="email" type="email"
        placeholder="შეიყვანე ელფოსტა"
        autocomplete="email" required>

      <label for="password">პაროლი</label>
      <input id="password" type="password"
        placeholder="მინიმუმ 8 სიმბოლო"
        minlength="8"
        autocomplete="current-password" required>

      <button class="main-btn" id="submitBtn" type="submit">
        შესვლა
      </button>
    </form>
  </div>

  <div id="accountArea" class="account-box hidden">
    <h2>ჩემი ანგარიში</h2>
    <p>შენ შესული ხარ ანგარიშში:</p>
    <div id="userEmail" class="account-email"></div>
    <button class="main-btn" id="logoutBtn" type="button">
      ანგარიშიდან გამოსვლა
    </button>
  </div>

  <div id="message" class="message" role="status"></div>

  <div class="links">
    <a href="index.html">← მაღაზიაში დაბრუნება</a>
    <br>
    <a href="admin.html">ადმინისტრატორის გვერდი</a>
  </div>
</div>

<script>
const SUPABASE_URL =
  "https://zlpotkepmucwzhtndycz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qFNKu2mnmjkTIBWs8X0rzg_bbHtkb4O";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const authArea = document.getElementById("authArea");
const accountArea = document.getElementById("accountArea");
const message = document.getElementById("message");
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const submitBtn = document.getElementById("submitBtn");
const authForm = document.getElementById("authForm");

let mode = "login";

function showMessage(text, error = false) {
  message.style.display = "block";
  message.textContent = text;
  message.style.border = error
    ? "1px solid #e53935"
    : "1px solid #388e3c";
}

function clearMessage() {
  message.style.display = "none";
  message.textContent = "";
}

function setMode(newMode) {
  mode = newMode;
  clearMessage();

  loginTab.classList.toggle("active", mode === "login");
  registerTab.classList.toggle("active", mode === "register");

  submitBtn.textContent =
    mode === "login" ? "შესვლა" : "ანგარიშის შექმნა";

  document.getElementById("password").autocomplete =
    mode === "login" ? "current-password" : "new-password";
}

loginTab.addEventListener("click", () => setMode("login"));
registerTab.addEventListener("click", () => setMode("register"));

function renderAccount(user) {
  if (user) {
    authArea.classList.add("hidden");
    accountArea.classList.remove("hidden");
    document.getElementById("userEmail").textContent =
      user.email || "მომხმარებელი";
  } else {
    accountArea.classList.add("hidden");
    authArea.classList.remove("hidden");
  }
}

authForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearMessage();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("შეავსე ორივე ველი.", true);
    return;
  }

  if (password.length < 8) {
    showMessage("პაროლი უნდა შეიცავდეს მინიმუმ 8 სიმბოლოს.", true);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "მიმდინარეობს...";

  try {
    if (mode === "register") {
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: new URL(
            "account.html",
            window.location.href
          ).href
        }
      });

      if (error) throw error;

      if (data.session) {
        renderAccount(data.user);
        showMessage("რეგისტრაცია წარმატებით დასრულდა!");
      } else {
        showMessage(
          "რეგისტრაცია მიღებულია! შეამოწმე ელფოსტა და დაადასტურე ანგარიში."
        );
      }
    } else {
      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      renderAccount(data.user);
      showMessage("წარმატებით შეხვედით ანგარიშში!");
    }
  } catch (error) {
    showMessage(
      error.message || "შეცდომა მოხდა. სცადე თავიდან.",
      true
    );
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent =
      mode === "login" ? "შესვლა" : "ანგარიშის შექმნა";
  }
});

document.getElementById("logoutBtn").addEventListener(
  "click",
  async () => {
    const { error } = await supabase.auth.signOut({
      scope: "local"
    });

    if (error) {
      showMessage(error.message, true);
      return;
    }

    renderAccount(null);
    showMessage("ანგარიშიდან გამოხვედი.");
  }
);

supabase.auth.onAuthStateChange((event, session) => {
  renderAccount(session?.user || null);
});

async function checkSession() {
  const { data, error } = await supabase.auth.getSession();

  if (error) {
    showMessage(error.message, true);
    return;
  }

  renderAccount(data.session?.user || null);
}

checkSession();
</script>
</body>
</html>
